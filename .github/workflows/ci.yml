name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 地图网格校验
        run: node scripts/check-map.mjs

      - name: 内容引用校验
        run: node scripts/check-content.mjs

      - name: 实体可达性校验
        run: node scripts/check-entity.mjs

      - name: 构建
        run: npm run build
